# Command prefix is Alt-q.
unbind-key C-b
set-option -g prefix M-q
bind-key M-q send-prefix

# Vim-like movement and window splitting.
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key , last-pane
bind-key s split-window -c "#{pane_current_path}"
bind-key v split-window -h -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"
set-window-option -g mode-keys vi

# Start window and pane numbers at 1.
set-option -g base-index 1
set-option -g pane-base-index 1

# Display pane numbers on prefix-q until one is selected.
bind-key q display-panes -d 0

# Movement without prefix.
bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R
bind-key -n M-z resize-pane -Z

# Window splitting without prefix.
bind-key -n M-n split-window -h -c "#{pane_current_path}"
bind-key -n M-N split-window -v -c "#{pane_current_path}"

# Mouse support.
set-option -g mouse on

# 256 color + true color support.
set-option -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

# Prevent delay when hitting Esc in Vim.
set-option -s escape-time 0

# Status line.
set-option -g status-position top
set-option -g window-status-format "#{b:window_name}"
set-option -g window-status-current-format "#{b:window_name}"
set-option -g status-interval 1
set-option -g status-right ""
set-option -g status off
set-hook -g window-linked "if -F '#{==:#{session_windows},1}' 'set -g status off' 'set -g status on'"
set-hook -g window-unlinked "if -F '#{==:#{session_windows},1}' 'set -g status off' 'set -g status on'"

# Colors.
set-option -g status-style bg=gray,fg=black
set-window-option -g window-status-current-style bg=gray,fg=green
set-option -g pane-border-style fg=gray
set-option -g pane-active-border-style fg=gray
